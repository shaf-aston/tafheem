# Every PR and every push to master runs both test suites. The server deploys
# master by itself every 5 minutes, so this is the only gate before live.
# Data not in git (CAMeL data, parser models, built databases) is absent here;
# tests that need it skip themselves by checking it is present.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# Read the code and the parser-model release, nothing else: a step that is tricked into running
# someone's code gets a token that can change nothing. Actions are pinned to a commit, not a tag,
# because a tag can be moved; Dependabot (.github/dependabot.yml) proposes the new commit when one ships.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-torch.txt  # the CPU torch: PyPI's brings GB of CUDA and fills the disk
      - run: pip install -r requirements.txt pytest ruff==0.15.8
      - run: ruff check .
      - run: python -m pytest tests -q

  # The whole-sentence tests and the scored sets need the parser. Its encoder
  # (~110 MB) is too big for git, so it comes from the release tagged parser-model;
  # CAMeL's data is fetched once and cached. Until that release exists this job
  # says so and skips, as the tests did before.
  nahw:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a run takes about 10; a hang dumps where it is stuck (faulthandler_timeout) and stops here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Fetch the parser encoder
        id: model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download parser-model -p encoder.onnx -D backend/data/parser; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No parser-model release with encoder.onnx: whole-sentence tests and the score check skipped"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: steps.model.outputs.ready == 'true'
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.model.outputs.ready == 'true'
        with:
          path: ~/.camel_tools
          key: camel-data-defaults-v1
      - if: steps.model.outputs.ready == 'true'
        run: |
          pip install -r requirements-torch.txt
          pip install -r requirements.txt pytest
          camel_data -i defaults
      - name: Build CAMeL's BERT as ONNX and check it ranks as CAMeL's own does
        if: steps.model.outputs.ready == 'true'
        # the tests and scores below then run on the ONNX copy, as the server does
        run: |
          python -m backend.scripts.nahw.build_disambig_onnx
          python -m backend.scripts.nahw.check_disambig_parity --ayahs 600
      - name: Whole-sentence tests
        if: steps.model.outputs.ready == 'true'
        # every nahw test: one named nowhere would be skipped here and go stale unseen, as 11 files once did
        run: python -m pytest tests/nahw tests/dictionary/test_sentence_set.py -q -o faulthandler_timeout=600
      - name: Scores no lower than the baseline
        if: steps.model.outputs.ready == 'true'
        run: python -m backend.scripts.nahw.score_iraab --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:css
      - run: npm test
      - run: npm run build
