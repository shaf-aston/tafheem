# Known vulnerabilities in what the app installs. Kept out of ci.yml on purpose: the server deploys
# only commits ci.yml passed (deploy/sync.sh), and a CVE published overnight must not stop an
# unrelated fix from going live. This one reports; Dependabot (.github/dependabot.yml) proposes the fix.
# The live server keeps what it installed, so its own check is in the plan's runbook:
# docs/plans/2026-11-11-security.md (Supply chain).
name: Security audit

on:
  schedule:
    - cron: "17 4 * * 1"  # Monday morning, off the hour
  pull_request:
    paths:
      - "requirements*.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      # Installed as ci.yml installs it (the floors take the newest release), then the installed set is
      # audited. torch comes from its own CPU index first: through requirements.txt alone, camel-tools
      # would pull the CUDA build and fill the runner's disk. pip-audit only warns that it cannot look
      # up a "+cpu" build; that one is audited by hand when requirements-torch.txt moves.
      - run: pip install -r requirements-torch.txt
      - run: pip install -r requirements.txt pip-audit==2.9.0
      - run: pip-audit --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
      # What ships to the browser; dev tools (vite, vitest, eslint) never reach a learner.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
