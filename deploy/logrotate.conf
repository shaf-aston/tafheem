# Rotation for the backend's own logs, once for both processes (tafheem@8000, @8001).
# Python cannot do it safely here: each process renaming the file would pull it from under the other.
# Install (deploy/setup.sh does it): sudo install -m 644 deploy/logrotate.conf /etc/logrotate.d/tafheem
# Check it: sudo logrotate -d /etc/logrotate.d/tafheem

# Refusals and account events (services/core/audit.py). The app reopens the file when it moves
# (WatchedFileHandler), so a fresh one is created. 90 days, then gone: privacy.html says so.
/home/ubuntu/tafheem/logs/security.jsonl {
	su ubuntu ubuntu
	daily
	rotate 90
	dateext
	compress
	delaycompress
	missingok
	notifempty
	create 0640 ubuntu ubuntu
}

# The server's own log (main.py). A plain FileHandler keeps its file open, so it is copied and
# emptied in place rather than moved; a line written during the copy can be lost, which is fine here.
/home/ubuntu/tafheem/backend.log {
	su ubuntu ubuntu
	weekly
	rotate 8
	compress
	delaycompress
	missingok
	notifempty
	copytruncate
}
