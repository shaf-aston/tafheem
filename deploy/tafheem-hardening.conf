# Sandbox for the backend (tafheem@8000, tafheem@8001). A drop-in, so the unit itself is unchanged.
# Install: sudo install -D -m 644 deploy/tafheem-hardening.conf /etc/systemd/system/tafheem@.service.d/hardening.conf
#          sudo systemctl daemon-reload
# Roll out one copy at a time (the other keeps serving):
#   sudo systemctl restart tafheem@8001; curl -fsS http://127.0.0.1:8001/api/health
#   use the site through 8001 (speak a word, upload a recording, recite, hadith meaning search, save progress), then
#   journalctl -u tafheem@8001 --since -10min | grep -iE "read-only file system|permission denied|operation not permitted"
#   if quiet: sudo systemctl restart tafheem@8000
# Undo: sudo rm /etc/systemd/system/tafheem@.service.d/hardening.conf && sudo systemctl daemon-reload && restart both.
# Score before/after: systemd-analyze security tafheem@8000.service
#
# Every path below must exist before the unit starts, or the start fails with status=226/NAMESPACE.
# Those marked "-" are skipped when missing; the ExecStartPre line makes the ones that must exist.
#
# Deliberately NOT set: MemoryDenyWriteExecute=yes. torch (libtorch_cpu: oneDNN) and ctranslate2
# (faster-whisper) generate CPU kernels at run time with Xbyak, which needs writable+executable memory.

[Service]
# Runs as root (the "+"), outside the sandbox, before it is built: creates what the app writes to if a
# fresh machine lacks it, owned by ubuntu. Leaves anything that already exists untouched.
# ($$d: systemd would otherwise substitute $d itself, as an environment variable.)
ExecStartPre=+/bin/sh -c 'for d in /home/ubuntu/tafheem/logs /home/ubuntu/tafheem/backend/data /home/ubuntu/.cache/huggingface; do [ -d "$$d" ] || install -d -o ubuntu -g ubuntu -m 0750 "$$d"; done; [ -e /home/ubuntu/tafheem/backend.log ] || install -o ubuntu -g ubuntu -m 0640 /dev/null /home/ubuntu/tafheem/backend.log'

# The process and its children (ffmpeg) can never gain privileges via setuid binaries or file capabilities.
NoNewPrivileges=yes
# Own empty /tmp and /var/tmp, discarded when the unit stops; nothing else on the machine sees them.
PrivateTmp=yes
# The whole filesystem is read-only to the app, except /dev, /proc, /sys and the ReadWritePaths below.
ProtectSystem=strict
# /home, /root and /run/user are read-only: the code, venv, .env and ~/.camel_tools stay readable but cannot be changed.
ProtectHome=read-only
# Exactly what the running app writes:
#   backend/data: progress.db (+ -wal/-shm), speech_cache/, recordings/, quran_cache/,
#                 dictionary english_entries.json, colloquial reference downloads, rijal page cache.
#   logs/:        security.jsonl, recite-journal.jsonl (+ rotations), searches.jsonl.
#   backend.log:  main.py's FileHandler (a file, not a folder).
ReadWritePaths=/home/ubuntu/tafheem/backend/data /home/ubuntu/tafheem/logs /home/ubuntu/tafheem/backend.log
# Hugging Face cache: faster-whisper's model and hadith meaning's ONNX model download here on first use.
ReadWritePaths=-/home/ubuntu/.cache/huggingface
# Private /dev with only null, zero, random, urandom, tty etc.: no disks, no GPU (nothing here uses one).
PrivateDevices=yes
# /proc/sys, /sys, /proc/sysrq-trigger etc. are read-only: no kernel tuning from the app.
ProtectKernelTunables=yes
# No loading or unloading kernel modules, and /usr/lib/modules is hidden.
ProtectKernelModules=yes
# No reading or writing the kernel log ring buffer (/dev/kmsg, /proc/kmsg).
ProtectKernelLogs=yes
# The cgroup tree (/sys/fs/cgroup) is read-only.
ProtectControlGroups=yes
# Cannot change the system clock.
ProtectClock=yes
# Cannot change the hostname or domain name.
ProtectHostname=yes
# Cannot create setuid or setgid files.
RestrictSUIDSGID=yes
# Cannot switch the execution domain (personality), which some exploits use.
LockPersonality=yes
# Cannot create namespaces (unshare/clone), so no user-namespace tricks; nothing here sandboxes itself.
RestrictNamespaces=yes
# Cannot take realtime scheduling and starve the machine.
RestrictRealtime=yes
# Only x86-64 (or arm64, on an Ampere VM) system calls; no 32-bit compat entry points.
SystemCallArchitectures=native
# No capabilities at all, even if something setuid sneaks in: port 8000/8001 is above 1024, so none is needed.
CapabilityBoundingSet=
# None handed to the process either.
AmbientCapabilities=
# Only IPv4, IPv6 and Unix sockets (uvicorn, outbound HTTPS to Groq/quran.com/edge-tts/HF, local Ollama).
# AF_NETLINK is left in because glibc's getaddrinfo(AI_ADDRCONFIG) and getifaddrs use it.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
# Other users' processes are hidden from /proc; only this service's own are visible.
ProtectProc=invisible
# Files the app creates (progress.db, recordings, logs) are not world-readable.
UMask=0027

# ── Stage 2: uncomment after stage 1 has run a week with nothing in the journal ──────────────────
# Only the system calls an ordinary service needs (systemd's curated list); any other returns EPERM
# instead of killing the process, so a surprise shows as an error in the log, not a crash loop.
# Staged because torch, ctranslate2 and onnxruntime have not been run under it here.
#SystemCallFilter=@system-service
#SystemCallErrorNumber=EPERM
#
# Not used, on purpose:
#   MemoryDenyWriteExecute=yes  breaks torch's and ctranslate2's oneDNN/Xbyak run-time kernels (see top).
#   ProcSubset=pid              hides /proc/cpuinfo and /proc/meminfo, which torch, onnxruntime and
#                               ctranslate2 read to size their thread pools.
#   RemoveIPC=yes               removes IPC objects of the whole ubuntu user on stop, i.e. the other
#                               backend copy's too, during every rolling restart.
#   ProtectHome=yes/tmpfs       would hide the app itself, which lives in /home/ubuntu.
