<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#161a3a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="1080" cy="160" r="220" fill="#a78bfa" opacity="0.10">
    <animate attributeName="r" values="200;240;200" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="160" r="120" fill="none" stroke="url(#ink)" stroke-width="2" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="0 1080 160" to="360 1080 160" dur="30s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dasharray" values="10 20;40 10;10 20" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="1080" y="185" text-anchor="middle" font-family="'Amiri','Noto Naskh Arabic',serif" font-size="72" fill="url(#ink)">تفهيم</text>
  <text x="80" y="140" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="url(#ink)">Tafheem</text>
  <text x="82" y="190" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="26" fill="#cbd5e1">Understand the Qur'an and classical Arabic, word by word.</text>
  <text x="82" y="240" font-family="ui-monospace,Consolas,monospace" font-size="18" fill="#7dd3fc">$ grammar trees · i'raab · recitation checking<tspan fill="#f0abfc"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>▋</tspan></text>
</svg>
