<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mutashabihat prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1220;--surface:#141b2d;--hi:#1b2440;--border:#26304a;--text:#e6e9f2;--dim:#a9b1c6;--faint:#7f89a3;--accent:#93c5fd;--a:#5eead4;--b:#fbbf24;--ok:#4ade80;--bad:#fb7185;--r:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:1180px;margin:auto;padding:20px 16px}
h1{font-size:22px;margin:0;display:flex;gap:10px;align-items:baseline}h1 .ar{font-family:'Amiri Quran',serif;font-weight:400;color:var(--accent);font-size:24px}
.sub{color:var(--dim);margin:2px 0 18px}
.grid{display:grid;grid-template-columns:300px 1fr;gap:18px}@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.side{padding:12px;align-self:start;position:sticky;top:12px}
select{width:100%;background:var(--hi);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 10px;font:inherit;margin-bottom:10px}
.stat{display:flex;justify-content:space-between;color:var(--dim);font-size:13px;margin:4px 2px 10px}
.bar{height:6px;background:var(--hi);border-radius:9px;overflow:hidden;margin:-4px 2px 12px}.bar i{display:block;height:100%;background:var(--ok)}
.pairs{display:flex;flex-direction:column;gap:6px}@media(max-width:820px){.pairs{flex-direction:row;overflow-x:auto}.pairs button{min-width:220px}.side{position:static}}
.pairs button{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;border:1px solid transparent;display:grid;grid-template-columns:1fr auto;gap:2px}
.pairs button:hover{background:var(--hi)}.pairs button[aria-current=true]{background:var(--hi);border-color:var(--accent)}
.pairs .k{font-weight:600;font-size:14px}.pairs .n{color:var(--faint);font-size:12px}.pairs .m{grid-row:span 2;align-self:center;font-size:12px;color:var(--faint)}.pairs .m.done{color:var(--ok)}
.main{padding:18px}
.steps{display:flex;gap:6px;margin-bottom:16px;background:var(--hi);padding:4px;border-radius:999px;width:max-content}
.steps button{all:unset;cursor:pointer;padding:7px 16px;border-radius:999px;color:var(--dim);font-weight:600;font-size:14px}.steps button[aria-pressed=true]{background:var(--surface);color:var(--accent)}
.verse{border-radius:12px;padding:14px 16px;background:var(--bg);border:1px solid var(--border);margin-bottom:10px}
.tag{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:700;margin-bottom:6px}.tag i{width:10px;height:10px;border-radius:50%}
.ar{font-family:'Amiri Quran',serif;direction:rtl;text-align:right;font-size:27px;line-height:2.3}
.w{color:var(--faint)}.w.d{font-weight:700;border-bottom:2px solid currentColor}
.key{margin-top:14px}.key h3,.drill h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.row>div{background:var(--hi);border-radius:10px;padding:6px 12px}
.row .ar{font-size:22px;line-height:1.9}.row small{display:block;font-size:12px;font-weight:700}
.none{font-family:Inter;font-size:13px;color:var(--faint);direction:ltr;text-align:right;font-style:italic}
.gap{display:inline-block;min-width:70px;border-bottom:2px dashed var(--faint);margin:0 4px;text-align:center}.gap.now{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:6px 6px 0 0;animation:p 1.4s infinite}
@keyframes p{50%{background:color-mix(in srgb,var(--accent) 22%,transparent)}}
.gap.ok{color:var(--ok);border-color:var(--ok)}.gap.bad{color:var(--bad);border-color:var(--bad)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opts button{all:unset;cursor:pointer;background:var(--hi);border:1px solid var(--border);border-radius:12px;padding:10px 14px;text-align:center}.opts button:hover{border-color:var(--accent)}
.opts .ar{text-align:center;font-size:24px;line-height:1.8}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px}.fb.ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}.fb.bad{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.cta{all:unset;cursor:pointer;background:var(--accent);color:#0d1220;font-weight:700;padding:9px 18px;border-radius:999px;margin-top:14px;display:inline-block}
.prompt{color:var(--dim);font-size:14px;margin-bottom:8px}.prompt b{color:var(--text)}
.note{color:var(--faint);font-size:12px;margin-top:18px;border-top:1px solid var(--border);padding-top:10px}
</style></head><body><div class="wrap">
<h1>Similar verses <span class="ar">مُتَشَابِهَات</span></h1>
<p class="sub">Verses that look almost the same. See the difference, then learn which wording belongs where.</p>
<div class="grid">
 <aside class="card side">
  <select><option>All surahs</option><option>2. Al-Baqarah</option><option>7. Al-Aʿrāf</option></select>
  <div class="stat"><span>Mastered</span><span id="score"></span></div><div class="bar"><i id="bari"></i></div>
  <div class="pairs" id="pairs"></div>
 </aside>
 <section class="card main">
  <div class="steps"><button id="s1" aria-pressed="true">1 · Compare</button><button id="s2">2 · Drill</button></div>
  <div id="view"></div>
  <p class="note">Prototype · real verses and real differences from the catalogue (Hidāyat al-Murtāb, Tatimmat al-Bayān, Qari Idrees Al Asim's list).</p>
 </section>
</div></div>
<script>
const P=[{"a": {"key": "2:59", "surah": "Al-Baqarah", "text": "فَبَدَّلَ الَّذِينَ ظَلَمُوا قَوْلًا غَيْرَ الَّذِي قِيلَ لَهُمْ فَأَنزَلْنَا عَلَى الَّذِينَ ظَلَمُوا رِجْزًا مِّنَ السَّمَاءِ بِمَا كَانُوا يَفْسُقُونَ"}, "b": {"key": "7:162", "surah": "Al-Aʿrāf", "text": "فَبَدَّلَ الَّذِينَ ظَلَمُوا مِنْهُمْ قَوْلًا غَيْرَ الَّذِي قِيلَ لَهُمْ فَأَرْسَلْنَا عَلَيْهِمْ رِجْزًا مِّنَ السَّمَاءِ بِمَا كَانُوا يَظْلِمُونَ"}, "type": "multiple differences", "changes": [{"self": [3, 3], "other": [3, 4]}, {"self": [8, 12], "other": [9, 11]}, {"self": [17, 18], "other": [16, 17]}]}, {"a": {"key": "2:62", "surah": "Al-Baqarah", "text": "إِنَّ الَّذِينَ آمَنُوا وَالَّذِينَ هَادُوا وَالنَّصَارَىٰ وَالصَّابِئِينَ مَنْ آمَنَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ وَعَمِلَ صَالِحًا فَلَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ"}, "b": {"key": "5:69", "surah": "Al-Māʾidah", "text": "إِنَّ الَّذِينَ آمَنُوا وَالَّذِينَ هَادُوا وَالصَّابِئُونَ وَالنَّصَارَىٰ مَنْ آمَنَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ وَعَمِلَ صَالِحًا فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ"}, "type": "order change", "changes": [{"self": [5, 5], "other": [5, 6]}, {"self": [6, 7], "other": [7, 7]}, {"self": [14, 19], "other": [14, 15]}]}, {"a": {"key": "3:126", "surah": "Āl ʿImrān", "text": "وَمَا جَعَلَهُ اللَّهُ إِلَّا بُشْرَىٰ لَكُمْ وَلِتَطْمَئِنَّ قُلُوبُكُم بِهِ ۗ وَمَا النَّصْرُ إِلَّا مِنْ عِندِ اللَّهِ الْعَزِيزِ الْحَكِيمِ"}, "b": {"key": "8:10", "surah": "Al-Anfāl", "text": "وَمَا جَعَلَهُ اللَّهُ إِلَّا بُشْرَىٰ وَلِتَطْمَئِنَّ بِهِ قُلُوبُكُمْ ۚ وَمَا النَّصْرُ إِلَّا مِنْ عِندِ اللَّهِ ۚ إِنَّ اللَّهَ عَزِيزٌ حَكِيمٌ"}, "type": "multiple differences", "changes": [{"self": [5, 6], "other": [5, 5]}, {"self": [7, 7], "other": [6, 7]}, {"self": [8, 9], "other": [9, 9]}, {"self": [16, 18], "other": [16, 20]}]}, {"a": {"key": "2:173", "surah": "Al-Baqarah", "text": "إِنَّمَا حَرَّمَ عَلَيْكُمُ الْمَيْتَةَ وَالدَّمَ وَلَحْمَ الْخِنزِيرِ وَمَا أُهِلَّ بِهِ لِغَيْرِ اللَّهِ ۖ فَمَنِ اضْطُرَّ غَيْرَ بَاغٍ وَلَا عَادٍ فَلَا إِثْمَ عَلَيْهِ ۚ إِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ"}, "b": {"key": "16:115", "surah": "An-Naḥl", "text": "إِنَّمَا حَرَّمَ عَلَيْكُمُ الْمَيْتَةَ وَالدَّمَ وَلَحْمَ الْخِنزِيرِ وَمَا أُهِلَّ لِغَيْرِ اللَّهِ بِهِ ۖ فَمَنِ اضْطُرَّ غَيْرَ بَاغٍ وَلَا عَادٍ فَإِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ"}, "type": "order change", "changes": [{"self": [9, 10], "other": [9, 9]}, {"self": [13, 13], "other": [11, 12]}, {"self": [19, 24], "other": [19, 20]}]}, {"a": {"key": "2:35", "surah": "Al-Baqarah", "text": "وَقُلْنَا يَا آدَمُ اسْكُنْ أَنتَ وَزَوْجُكَ الْجَنَّةَ وَكُلَا مِنْهَا رَغَدًا حَيْثُ شِئْتُمَا وَلَا تَقْرَبَا هَٰذِهِ الشَّجَرَةَ فَتَكُونَا مِنَ الظَّالِمِينَ"}, "b": {"key": "7:19", "surah": "Al-Aʿrāf", "text": "وَيَا آدَمُ اسْكُنْ أَنتَ وَزَوْجُكَ الْجَنَّةَ فَكُلَا مِنْ حَيْثُ شِئْتُمَا وَلَا تَقْرَبَا هَٰذِهِ الشَّجَرَةَ فَتَكُونَا مِنَ الظَّالِمِينَ"}, "type": "", "changes": [{"self": [0, 2], "other": [0, 1]}, {"self": [7, 10], "other": [6, 8]}]}], MAX=6, done=new Set();
let cur=0,step='compare',dr=null;
const words=t=>t.split(/\s+/).filter(Boolean);
const side=(c,w)=>c[w]; // span or null
function inSpan(i,spans){return spans.some(s=>s&&i>=s[0]&&i<s[1])}
function verseHTML(v,spans,col){return `<div class="verse"><div class="tag" style="color:${col}"><i style="background:${col}"></i>${v.surah} · ${v.key}</div><div class="ar">${words(v.text).map((x,i)=>inSpan(i,spans)?`<span class="w d" style="color:${col}">${x}</span>`:`<span class="w">${x}</span>`).join(' ')}</div></div>`}
const slice=(v,s)=>s&&s[1]>s[0]?words(v.text).slice(s[0],s[1]).join(' '):null;
function renderPairs(){document.getElementById('pairs').innerHTML=P.map((p,i)=>`<button aria-current="${i===cur}" data-i="${i}"><span class="k">${p.a.surah.split('-').pop()} ${p.a.key} ↔ ${p.b.surah.split('-').pop()} ${p.b.key}</span><span class="m ${done.has(i)?'done':''}">${done.has(i)?'✓ mastered':'new'}</span><span class="n">${p.changes.length} differences</span></button>`).join('');
 document.querySelectorAll('#pairs button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;dr=null;render()});
 document.getElementById('score').textContent=`${done.size} of ${P.length}`;document.getElementById('bari').style.width=100*done.size/P.length+'%'}
function compare(){const p=P[cur];
 const row=c=>`<div class="row"><div><small style="color:var(--a)">${p.a.surah}</small>${slice(p.a,c.self)?`<div class="ar">${slice(p.a,c.self)}</div>`:`<div class="none">— nothing here —</div>`}</div><div><small style="color:var(--b)">${p.b.surah}</small>${slice(p.b,c.other)?`<div class="ar">${slice(p.b,c.other)}</div>`:`<div class="none">— nothing here —</div>`}</div></div>`;
 return verseHTML(p.a,p.changes.map(c=>c.self),'var(--a)')+verseHTML(p.b,p.changes.map(c=>c.other),'var(--b)')+`<div class="key"><h3>What tells them apart</h3>${p.changes.map(row).join('')}</div><button class="cta" onclick="step='drill';render()">Drill this pair →</button>`}
function newDrill(){const p=P[cur];const qs=[];
 for(const [me,them,mk,tk,col] of [[p.a,p.b,'self','other','var(--a)'],[p.b,p.a,'other','self','var(--b)']])
  p.changes.forEach(c=>{const right=slice(me,c[mk]),wrong=slice(them,c[tk]);if((right||'').split(' ').length<=MAX&&(wrong||'').split(' ').length<=MAX)qs.push({me,them,span:c[mk],right,wrong,col,all:p.changes.map(x=>x[mk])})});
 return {qs,i:0,wrong:0,ans:null}}
function drill(){if(!dr)dr=newDrill();const q=dr.qs[dr.i];
 if(!q){const ok=dr.wrong===0;if(ok)done.add(cur);renderPairs();return `<div class="fb ${ok?'ok':'bad'}">${ok?'All correct, this pair is mastered.':`${dr.wrong} slip${dr.wrong>1?'s':''}. Look at the differences again, then try once more.`}</div><button class="cta" onclick="${ok?`cur=(cur+1)%P.length;step='compare';dr=null;render()`:`step='compare';dr=null;render()`}">${ok?'Next pair →':'Compare again'}</button>`}
 const ws=words(q.me.text);let html='',i=0;
 for(let i=0;i<=ws.length;i++){
  if(i===q.span[0]){const cls=dr.ans==null?'now':dr.ans?'ok':'bad';html+=`<span class="gap ${cls}">${dr.ans==null?'&nbsp;?&nbsp;':(q.right||'∅')}</span> `}
  if(i>=q.span[0]&&i<q.span[1])continue;
  if(i<ws.length)html+=`<span class="w" style="${inSpan(i,q.all)?'color:var(--dim)':''}">${ws[i]}</span> `}
 const opts=[{t:q.right,ok:true},{t:q.wrong,ok:false}].sort(()=>((q.me.key+dr.i).length%2?1:-1));
 return `<div class="drill"><h3>Question ${dr.i+1} of ${dr.qs.length}</h3><p class="prompt">How does <b style="color:${q.col}">${q.me.surah} ${q.me.key}</b> say it?</p><div class="verse"><div class="ar">${html}</div></div>
 ${dr.ans==null?`<div class="opts">${opts.map(o=>`<button data-ok="${o.ok}">${o.t?`<div class="ar">${o.t}</div>`:`<div class="none" style="text-align:center">— nothing here —</div>`}</button>`).join('')}</div>`:
 `<div class="fb ${dr.ans?'ok':'bad'}">${dr.ans?'Right.':`Not quite: that wording is from ${q.them.surah} ${q.them.key}.`}</div><button class="cta" onclick="dr.i++;dr.ans=null;render()">Next →</button>`}</div>`}
function render(){document.getElementById('s1').ariaPressed=step==='compare';document.getElementById('s2').ariaPressed=step==='drill';
 document.getElementById('view').innerHTML=step==='compare'?compare():drill();renderPairs();
 document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{dr.ans=b.dataset.ok==='true';if(!dr.ans)dr.wrong++;render()})}
document.getElementById('s1').onclick=()=>{step='compare';render()};document.getElementById('s2').onclick=()=>{step='drill';dr=null;render()};
render();
</script></body></html>
