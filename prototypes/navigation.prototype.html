<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Navigation</title>
<!--
  PROTOTYPE, throwaway. Question: the tab strip holds eight sections and is full
  (see frontend/src/lib/tabs.js). Colloquial Arabic is the ninth, more will follow.
  How should the header navigate between many sections?
  Four variants, switched with ?variant=A|B|C|D, the bar at the bottom, or arrow keys.
  Resize the window to phone width to compare each on mobile.
-->
<style>
  :root {
    --bg: #faf7f0; --surface: #fffdf8; --ink: #2b2620; --muted: #6f665a; --line: #e2d9c8;
    --shadow: 0 8px 28px rgba(40,30,10,.14); --bar-bg: #111; --bar-ink: #fff;
    --r: 10px; --ease: 180ms ease;
    font-family: system-ui, "Segoe UI", sans-serif; color: var(--ink);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17150f; --surface: #221f18; --ink: #efe8da; --muted: #a99f8e; --line: #3a352b;
      --shadow: 0 8px 28px rgba(0,0,0,.5); --bar-bg: #f4f1ea; --bar-ink: #111; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); padding-bottom: 110px; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
  button:focus-visible { outline: 3px solid var(--c, #0f766e); outline-offset: 2px; border-radius: 6px; }
  .ar { font-family: "Noto Naskh Arabic", "Traditional Arabic", serif; }

  header { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 12px 16px 6px; font-weight: 700; }
  .brand .ar { font-size: 1.3rem; color: var(--muted); font-weight: 400; }
  .strip { display: flex; flex-wrap: wrap; align-items: stretch; gap: 2px; padding: 0 12px; position: relative; }
  .tab { position: relative; padding: 10px 10px; white-space: nowrap; color: var(--muted); font-weight: 500; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--c); }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .caret { font-size: .7em; margin-left: 4px; display: inline-block; transition: transform var(--ease); }
  [aria-expanded="true"] .caret { transform: rotate(180deg); }

  .menu { position: absolute; top: 100%; margin-top: 4px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; min-width: 220px; z-index: 10; }
  .menu[hidden] { display: none; }
  .item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 8px; }
  .item:hover, .item.on { background: color-mix(in srgb, var(--c) 12%, transparent); }
  .item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
  .item .ar { margin-left: auto; color: var(--muted); }
  .item .new { font-size: .7rem; padding: 1px 6px; border-radius: 99px; background: var(--c); color: var(--surface); margin-left: 6px; }
  .grouphead { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px 10px 4px; }

  @media (max-width: 520px) { .tab { padding: 10px 6px; } .gprefix { display: none; } .menu { min-width: 200px; } }
  main { max-width: 60rem; margin: 0 auto; padding: 28px 16px; }
  .panel { border: 1px dashed var(--line); border-radius: var(--r); padding: 28px; background: var(--surface); }
  .panel h2 { margin: 0 0 6px; color: var(--c); }
  .panel p { color: var(--muted); margin: 0; }
  .note { margin-top: 18px; font-size: .92rem; line-height: 1.5; }
  .note b { color: var(--ink); }
  .pro { color: #2f855a; } .con { color: #b0413e; }
  @media (prefers-color-scheme: dark) { .pro { color: #68d391; } .con { color: #fc8181; } }

  /* C: grid launcher */
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: flex; align-items: flex-start; justify-content: center; padding: 70px 16px; }
  .sheet[hidden] { display: none; }
  .sheet .card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; width: 100%; max-width: 640px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 8px; }
  .tile { border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: left; border-left: 4px solid var(--c); }
  .tile:hover { background: color-mix(in srgb, var(--c) 10%, transparent); }
  .tile .ar { display: block; color: var(--muted); font-size: 1.1rem; }

  /* D: two tier */
  .tier2 { display: flex; gap: 2px; padding: 0 12px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--c) 5%, var(--surface)); overflow-x: auto; }
  .tier2 .tab { font-size: .92rem; padding: 8px 10px; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bar-bg); color: var(--bar-ink); padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; z-index: 30; font-size: .9rem; }
  .bar button { padding: 6px 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--bar-ink) 30%, transparent); }
  .bar button[aria-pressed="true"] { background: var(--bar-ink); color: var(--bar-bg); }
</style>
</head>
<body>
<header>
  <div class="brand">Tafheem <span class="ar">تفهيم</span></div>
  <div id="nav"></div>
</header>
<main><div class="panel" id="panel"></div><div class="note" id="note"></div></main>
<div class="bar" id="bar"></div>

<script>
// Mirrors frontend/src/lib/tabs.js plus the proposed `group` field and the new ninth section.
const GROUPS = [
  { id: 'lang',  label: 'Language', arabic: 'اللغة' },
  { id: 'quran', label: 'Quran',    arabic: 'القرآن' },
  { id: 'tools', label: 'Practice & Tools', arabic: 'أدوات' },
]
const TABS = [
  { id: 'nahw', label: 'Nahw', arabic: 'نحو', group: 'lang', c: '#2563eb', pinned: true },
  { id: 'sarf', label: 'Sarf', arabic: 'صرف', group: 'lang', c: '#7c3aed', pinned: true },
  { id: 'colloq', label: 'Colloquial', arabic: 'عامية', group: 'lang', c: '#db2777', isNew: true },
  { id: 'quran', label: 'Quran', arabic: 'القرآن', group: 'quran', c: '#0f766e', pinned: true },
  { id: 'daleel', label: 'Daleel', arabic: 'دليل', group: 'quran', c: '#0891b2', pinned: true },
  { id: 'mem', label: 'Memorise', arabic: 'حفظ', group: 'quran', c: '#16a34a' },
  { id: 'dict', label: 'Dictionary', arabic: 'قاموس', group: 'tools', c: '#b45309', pinned: true },
  { id: 'quiz', label: 'Quiz', arabic: 'اختبار', group: 'tools', c: '#dc2626' },
  { id: 'timelines', label: 'Timelines', arabic: 'التاريخ', group: 'tools', c: '#6d28d9' },
]
const byId = Object.fromEntries(TABS.map(t => [t.id, t]))
const inGroup = g => TABS.filter(t => t.group === g)

const VARIANTS = {
  A: { name: 'A · "More ▾" overflow', note: `Pinned sections stay in the strip; everything else goes into a <b>More ▾</b> menu at the right end. Picking a hidden one shows it in the strip in place of "More".<br><span class="pro">+ Smallest change from today, familiar (browsers, Gmail).</span><br><span class="con">− Hidden sections are less discoverable; "More" grows into a junk drawer.</span>` },
  B: { name: 'B · Grouped dropdowns', note: `The strip holds 3 <b>groups</b>, each a dropdown with its sections. The active section's name replaces the group label, so you always see where you are.<br><span class="pro">+ Scales to dozens of sections, related ones sit together (Colloquial beside Nahw/Sarf), fits a phone on one row.</span><br><span class="con">− One extra click for every switch.</span>` },
  C: { name: 'C · ☰ All-sections launcher', note: `The strip shows your pinned sections; a <b>☰</b> button on the left opens a full grouped grid of every section.<br><span class="pro">+ Fast for favourites, a clear map of everything, room for descriptions later.</span><br><span class="con">− Two places to look; a modal on every non-pinned switch.</span>` },
  D: { name: 'D · Two-tier (group, then section)', note: `Top row picks the group, a second row shows that group's sections. No menus at all.<br><span class="pro">+ Zero hidden items, one click within a group, very clear hierarchy.</span><br><span class="con">− Takes a second row of vertical space on every page.</span>` },
}

let variant = new URLSearchParams(location.search).get('variant')?.toUpperCase()
if (!VARIANTS[variant]) variant = 'B'
let active = 'nahw'
let lastExtra = null

const nav = document.getElementById('nav')

function tabBtn(t, extra = '') {
  return `<button class="tab" role="tab" data-go="${t.id}" style="--c:${t.c}" aria-selected="${t.id === active}">${t.label}${extra}</button>`
}
function items(list) {
  return list.map(t => `<button class="item ${t.id === active ? 'on' : ''}" data-go="${t.id}" style="--c:${t.c}"><span class="dot"></span>${t.label}${t.isNew ? '<span class="new">new</span>' : ''}<span class="ar">${t.arabic}</span></button>`).join('')
}

function render() {
  const t = byId[active]
  let html = ''
  if (variant === 'A') {
    const pinned = TABS.filter(x => x.pinned)
    const shown = pinned.some(x => x.id === active) ? pinned : [...pinned, t]
    const rest = TABS.filter(x => !shown.includes(x))
    html = `<div class="strip" role="tablist">${shown.map(x => tabBtn(x)).join('')}
      <span style="flex:1"></span>
      <div style="position:relative"><button class="tab" data-menu="more" aria-expanded="false">More<span class="caret">▾</span></button>
      <div class="menu" data-for="more" style="right:0" hidden>${items(rest)}</div></div></div>`
  } else if (variant === 'B') {
    html = `<div class="strip" role="tablist">${GROUPS.map(g => {
      const here = t.group === g.id
      const c = here ? t.c : 'var(--muted)'
      return `<div style="position:relative"><button class="tab" data-menu="${g.id}" aria-expanded="false" aria-selected="${here}" style="--c:${c}">
        ${here ? `<span class="gprefix" style="opacity:.6;font-weight:400">${g.label} ·</span> ${t.label}` : g.label}<span class="caret">▾</span></button>
        <div class="menu" data-for="${g.id}" hidden>${items(inGroup(g.id))}</div></div>`
    }).join('')}</div>`
  } else if (variant === 'C') {
    const pinned = TABS.filter(x => x.pinned)
    const shown = pinned.some(x => x.id === active) ? pinned : [...pinned, t]
    html = `<div class="strip" role="tablist"><button class="tab" data-sheet aria-label="All sections" style="font-size:1.1rem">☰</button>${shown.map(x => tabBtn(x)).join('')}</div>
      <div class="sheet" id="sheet" hidden><div class="card">${GROUPS.map(g => `<div class="grouphead">${g.label} <span class="ar">${g.arabic}</span></div>
        <div class="grid">${inGroup(g.id).map(x => `<button class="tile" data-go="${x.id}" style="--c:${x.c}"><b>${x.label}</b>${x.isNew ? ' <span class="item"><span class="new" style="background:${x.c}">new</span></span>' : ''}<span class="ar">${x.arabic}</span></button>`).join('')}</div>`).join('')}</div></div>`
  } else {
    const g = t.group
    html = `<div class="strip" role="tablist">${GROUPS.map(x => {
      const first = inGroup(x.id)[0]
      return `<button class="tab" data-group="${x.id}" aria-selected="${x.id === g}" style="--c:${x.id === g ? t.c : first.c}">${x.label}</button>`
    }).join('')}</div>
      <div class="tier2" style="--c:${t.c}">${inGroup(g).map(x => tabBtn(x, x.isNew ? ' <span class="new" style="font-size:.65rem;padding:1px 5px;border-radius:99px;background:' + x.c + ';color:var(--surface)">new</span>' : '')).join('')}</div>`
  }
  nav.innerHTML = html
  const panel = document.getElementById('panel')
  panel.style.setProperty('--c', t.c)
  panel.innerHTML = `<h2>${t.label} <span class="ar">${t.arabic}</span></h2><p>Placeholder for the ${t.label} panel (group: ${GROUPS.find(g => g.id === t.group).label}).</p>`
  document.getElementById('note').innerHTML = VARIANTS[variant].note
  document.getElementById('bar').innerHTML = Object.entries(VARIANTS).map(([k, v]) =>
    `<button data-variant="${k}" aria-pressed="${k === variant}">${v.name}</button>`).join('')
}

function closeMenus() {
  document.querySelectorAll('.menu').forEach(m => m.hidden = true)
  document.querySelectorAll('[data-menu]').forEach(b => b.setAttribute('aria-expanded', 'false'))
}

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]')
  const menu = e.target.closest('[data-menu]')
  const v = e.target.closest('[data-variant]')
  const grp = e.target.closest('[data-group]')
  if (go) { active = go.dataset.go; render(); return }
  if (v) { variant = v.dataset.variant; history.replaceState(null, '', '?variant=' + variant); render(); return }
  if (grp) { active = inGroup(grp.dataset.group)[0].id; render(); return }
  if (e.target.closest('[data-sheet]')) { document.getElementById('sheet').hidden = false; return }
  if (e.target.id === 'sheet') { e.target.hidden = true; return }
  if (menu) {
    const m = document.querySelector(`.menu[data-for="${menu.dataset.menu}"]`)
    const open = m.hidden
    closeMenus()
    m.hidden = !open
    menu.setAttribute('aria-expanded', String(open))
    return
  }
  closeMenus()
})
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeMenus(); const s = document.getElementById('sheet'); if (s) s.hidden = true }
  const keys = Object.keys(VARIANTS)
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const i = keys.indexOf(variant) + (e.key === 'ArrowRight' ? 1 : -1)
    variant = keys[(i + keys.length) % keys.length]
    history.replaceState(null, '', '?variant=' + variant)
    render()
  }
})
render()
</script>
</body>
</html>
