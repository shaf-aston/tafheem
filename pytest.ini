[pytest]
# pytest-randomly (machine-global plugin) crashes reseeding numpy via thinc; tests do not rely on ordering.
# heavy tests are left out by default; run them with: pytest -m heavy
addopts = -p no:randomly -m "not heavy"
testpaths = tests
markers =
    heavy: loads ~3.7 GB of models (torch + CAMeL BERT) and holds it for the rest of the run
